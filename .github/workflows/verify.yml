name: Verify public artifacts

on:
  push:
  pull_request:

jobs:
  clean-clone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm run verify:release
      - name: Fetch and verify locked upstream archives
        run: python3 research/fetch_locked_inputs.py
      - name: Install locked scientific dependencies
        run: python3 -m pip install -r research/requirements-lock.txt
      - name: Rebuild frozen analysis from locked inputs
        run: |
          python3 -m unittest -v research.test_study
          python3 research/run_sota_study.py
          python3 research/verify_artifacts.py
          git diff --exit-code -- generated/frozen-benchmark.js research/results research/figures
